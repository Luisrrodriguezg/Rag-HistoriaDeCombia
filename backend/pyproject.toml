[project]
name = "rag-historia-colombia-backend"
version = "0.1.0"
description = "FastAPI backend for the RAG agent on Historia de Colombia"
requires-python = ">=3.11"
authors = [
    { name = "Luis Rodríguez" },
    { name = "Simón Gómez" },
]

dependencies = [
    # ── Web framework ─────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",

    # ── Config & validation ──────────────────────────────────
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # ── Auth (Keycloak JWT verification) ─────────────────────
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",

    # ── Database ─────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",

    # ── LangChain / LangGraph ────────────────────────────────
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-ollama>=0.2.0",
    "langchain-postgres>=0.0.12",
    "langchain-text-splitters>=0.3.2",
    "langgraph>=0.2.45",

    # ── Document parsing ─────────────────────────────────────
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",

    # ── Observability ────────────────────────────────────────
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pyright>=1.1.385",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.pyright]
include = ["app"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
