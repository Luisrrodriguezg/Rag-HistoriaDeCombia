server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every unknown route returns index.html so React Router
    # (or the in-app router state) can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed assets emitted by Vite.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
